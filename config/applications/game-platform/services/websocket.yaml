parameters:
    vs_websocket.document_root: "%kernel.project_dir%/public/game-platform"
    
    app_websocket_chat_url: '%env(WEBSOCKET_CHAT_URL)%'
    app_websocket_game_url: '%env(WEBSOCKET_GAME_URL)%'
    
    app_websocket_swoole_chat_url: '%env(WEBSOCKET_SWOOLE_CHAT_URL)%'
    app_websocket_swoole_game_url: '%env(WEBSOCKET_SWOOLE_GAME_URL)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true
    
    vs_websocket_swoole_chats_server_handler:
        class: App\Component\Websocket\WebsocketSwooleChatsHandler
        public: true
        arguments:
            - '@app_game_logger'
            - '@serializer'
            - '%vs_websocket.exeption_trace%'
            - '%app_websocket_swoole_chat_url%'
            - '@vs_websocket_client_factory'
            - '@vs_users.repository.users'
            - '@app_game_service'
    
    vs_websocket_swoole_games_server_handler:
        class: App\Component\Websocket\WebsocketSwooleGamesHandler
        public: true
        arguments:
            - '@app_game_logger'
            - '@serializer'
            - '%vs_websocket.exeption_trace%'
            - '%app_websocket_swoole_game_url%'
            - '@vs_websocket_client_factory'
            - '@vs_users.repository.users'
            - '@app_game_service'
    
    vs_websocket_chats_handler:
        class: App\Component\Websocket\WebsocketMessageHandler
        public: true
        arguments:
            - '@app_game_logger'
            - '@serializer'
            - '%vs_websocket.exeption_trace%'
            - '%app_websocket_chat_url%'
            - '@vs_websocket_client_factory'
            - '@vs_users.repository.users'
            - '@app_game_service'
    
    vs_websocket_games_handler:
        class: App\Component\Websocket\WebsocketGamesHandler
        public: true
        arguments:
            - '@app_game_logger'
            - '@serializer'
            - '%vs_websocket.exeption_trace%'
            - '%app_websocket_game_url%'
            - '@vs_websocket_client_factory'
            - '@vs_users.repository.users'
            - '@app_game_service'
            
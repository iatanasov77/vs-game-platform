<div class="modal-header">
    <h3 class="modal-title">Auction</h3>
    <button type="button" class="btn-close" aria-label="Close" (click)="dismissModal()"></button>
</div>

<div class="modal-body">
    
    <!-- Example Screenshot: https://github.com/PatrykkMar/Bridget/blob/main/Screenshots/1.png -->
    <div class="text-center mb-2">
        <div>It's youe turn. Highest bid is 3D</div>
        <div>E countered</div>
    </div>
    
    <div class="bridge-auction-container">
        
        <div class="text-center">
            <mat-button-toggle-group
                group name="bidValue"
                aria-label="Bid Value"
                [hideSingleSelectionIndicator]="true"
            >
                <mat-button-toggle value="1" (change)="setBidValue( $event.value )">1</mat-button-toggle>
                <mat-button-toggle value="2" (change)="setBidValue( $event.value )">2</mat-button-toggle>
                <mat-button-toggle value="3" (change)="setBidValue( $event.value )">3</mat-button-toggle>
                <mat-button-toggle value="4" (change)="setBidValue( $event.value )">4</mat-button-toggle>
                <mat-button-toggle value="5" (change)="setBidValue( $event.value )">5</mat-button-toggle>
                <mat-button-toggle value="6" (change)="setBidValue( $event.value )">6</mat-button-toggle>
                <mat-button-toggle value="7" (change)="setBidValue( $event.value )">7</mat-button-toggle>
            </mat-button-toggle-group>
        </div>
        
        <!-- Game HTML Entities: https://www.w3schools.com/charsets/ref_utf_cards.asp -->
        <div class="text-center">
            <mat-button-toggle-group
                group name="bidTrump"
                aria-label="Bid Trump"
                [hideSingleSelectionIndicator]="true"
            >
                <mat-button-toggle value="c" (change)="setBidTrump( $event.value )">&#9827;</mat-button-toggle>
                <mat-button-toggle value="d" (change)="setBidTrump( $event.value )">&#9830;</mat-button-toggle>
                <mat-button-toggle value="h" (change)="setBidTrump( $event.value )">&#9829;</mat-button-toggle>
                <mat-button-toggle value="s" (change)="setBidTrump( $event.value )">&#9824;</mat-button-toggle>
                <mat-button-toggle value="ba" (change)="setBidTrump( $event.value )">BA</mat-button-toggle>
            </mat-button-toggle-group>
        </div>
        
        <table class="bridge-table mt-4">
            <thead>
                <tr>
                    <th>West</th>
                    <th>North</th>
                    <th>East</th>
                    <th>South</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td><span class="pass">Pass</span></td>
                    <td>1 <span class="bid-suit">♥</span></td>
                    <td><span class="pass">Pass</span></td>
                    <td>2 <span class="bid-suit">♥</span></td>
                </tr>
                <tr>
                    <td><span class="pass">Pass</span></td>
                    <td><span class="pass">Pass</span></td>
                    <td><span class="pass">Pass</span></td>
                    <td></td>
                </tr>
                <tr><td></td><td></td><td></td><td></td></tr>
                <tr><td></td><td></td><td></td><td></td></tr>
            </tbody>
        </table>
        
    </div>
</div>

<!-- https://github.com/PatrykkMar/Bridget/blob/main/Screenshots/1.png -->
<div class="modal-footer">
    <div class="row">
        <div class="col-5">&nbsp;</div>
        <div class="col-7">
            <span class="float-end">
                <button type="button" class="btn btn-outline-dark"
                    *ngIf="lastBid"
                    (click)="makeBid()"
                >
                    Counter
                </button>
                
                <button type="button" class="btn btn-outline-dark"
                    *ngIf="lastBid && lastBid.KontraPlayer"
                    (click)="makeBid()"
                >
                    Recounter
                </button>
                
                <button type="button" class="btn btn-outline-dark"
                    (click)="makeBid()"
                >
                    Pass
                </button>
                
                <button type="button" class="btn btn-outline-dark"
                    (click)="makeBid()"
                    [disabled]="!bidValue || !bidTrump"
                >
                    Bid
                </button>
            </span>
        </div>
    </div>
</div>

parameters:
    vs_websocket_ratchet_url: '%env(WEBSOCKET_RATCHET_TEST_URL)%'
    vs_websocket_swoole_url: '%env(WEBSOCKET_SWOOLE_TEST_URL)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true
    
    ##############################################################
    # Websocket Server Handlers
    ##############################################################
    vs_websocket_ratchet_server_handler_test:
        class: App\Component\Websocket\TestWebsocketRatchetHandler
        public: true
        arguments:
            - '@vs_websocket_logger'
            - '@serializer'
            - '%vs_websocket.exeption_trace%'
            - '%vs_websocket_ratchet_url%'
            - '@vs_websocket_client_factory'
    
    vs_websocket_swoole_server_handler_test:
        class: App\Component\Websocket\TestWebsocketSwooleHandler
        public: true
        arguments:
            - '@vs_websocket_logger'
            - '@serializer'
            - '%vs_websocket.exeption_trace%'
            - '%vs_websocket_swoole_url%'
            - '@vs_websocket_client_factory'
    
    ##############################################################
    # Debug Controllers
    ##############################################################
    App\Controller\GamePlatform\DebugController:
        tags: ['controller.service_arguments']
        autowire: true
    
    App\Controller\Application\TestMercureController:
        tags: ['controller.service_arguments']
        autowire: true
        arguments:
            - '@router'
            - '@doctrine'
            - '@messenger.default_bus'
            - '@app_mercure_logger'
            - '@app_mercure_publisher'
            - '@vsapp.repository.games'
            - '@vsapp.repository.game_players'
            - '@vsapp.factory.game_sessions'
            - '@vsapp.factory.temp_players'
    
    ##############################################################
    # Debug Comonents
    ##############################################################
    App\Component\ServerSentEvent\Handler\AddAiPlayerHandler:
        arguments:
            - '@app_mercure_logger'
            - '@mercure.hub.default'

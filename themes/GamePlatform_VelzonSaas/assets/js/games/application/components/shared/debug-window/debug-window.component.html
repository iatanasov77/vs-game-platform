<div class="modal-header">
    <h3 class="modal-title">Debug Window</h3>
    <button type="button" class="btn-close" aria-label="Close" (click)="dismissModal()"></button>
</div>

<div class="modal-body">
    <div class="bridge-auction-container">
        <textarea class="debug-textarea w-100" style="height: 350px;">{{ debugText }}</textarea>
    </div>
</div>

<div class="modal-footer">
    <div class="row">
        <div class="col-5">&nbsp;</div>
        <div class="col-7">
            <span class="float-end">
                <button type="button" class="btn btn-outline-dark" (click)="dismissModal()" >
                    Close
                </button>
            </span>
        </div>
    </div>
</div>

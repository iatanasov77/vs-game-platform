<div class="modal-header">
    <h5 class="modal-title">{{ 'dialogs.message' | translate }}</h5>
    <button type="button" class="btn-close" aria-label="Close" (click)="dismissModal()"></button>
</div>

<div class="modal-body">
    <div class="row mb-2">
        <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 col-12">
            <div [innerHtml]="message"></div>
            <div class="message-question" [innerHtml]="messageQuestion"></div>
        </div>
    </div>
</div>

<div class="modal-footer">
    <div class="row">
        <div class="col-7">&nbsp;</div>
        <div class="col-5">
            
            <button type="button" class="btn btn-outline-dark" (click)="exitGame()">
                {{ 'dialogs.yes' | translate }}
            </button>
            <button type="button" class="btn btn-outline-dark float-end" (click)="dismissModal()">
                {{ 'dialogs.no' | translate }} ( {{ timeLeft }} )
            </button>
        </div>
    </div>
</div>

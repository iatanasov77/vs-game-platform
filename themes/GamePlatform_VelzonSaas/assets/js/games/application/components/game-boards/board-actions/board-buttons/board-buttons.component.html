<div class="p-1 float-start game-board-buttons-container">
    <button *ngIf="! isLoggedIn" (click)="loginClick()" class="default-button">
        {{ 'dialogs.login' | translate }}
    </button>
    
    <!--
     -- Backgammon Lobby Buttons
    -->
    <ng-container *ngIf="lobbyButtonsVisible">
        <button *ngIf="isLoggedIn && ! acceptInviteVisible" (click)="playGame()" class="default-button">
            {{ 'game_board.play_game' | translate }}
        </button>
        
        <button *ngIf="isLoggedIn && ! acceptInviteVisible" (click)="inviteFriendClick()" class="default-button">
            {{ 'game_board.invite_friend' | translate }}
        </button>
        
        <button *ngIf="isLoggedIn && acceptInviteVisible" (click)="startInvitedGame(inviteId)" class="default-button">
            {{ 'logincontainer.accept' | translate }}
        </button>
    </ng-container>
    
    <ng-container *ngIf="! lobbyButtonsVisible">
        <!--
         -- Card Games Buttons
        -->
        <button *ngIf="playWithComputerVisible" (click)="playWithComputer()" class="default-button">
            {{ 'game_board.play_with_computer' | translate }}
        </button>
        
        <button (click)="newRound()" *ngIf="newRoundVisible" class="default-button">
            {{ 'game_board.new_round' | translate }}
        </button>
        
        <!--
         -- Backgammon Board Buttons
        -->
        <button (click)="newGame()" *ngIf="newVisible" class="default-button">
            {{ 'game_board.new_game' | translate }}
        </button>
        
        <button (click)="openAuctionDialog()" *ngIf="openAuctionDialogVisible" class="default-button">
            {{ 'contract-bridge-auction.auction' | translate }}
        </button>
        
        <button (click)="exitGame()" *ngIf="exitVisible" class="secondary-button">
            {{ 'game_board.exit_game' | translate }}
        </button>
        
        <!--
         -- Backgammon Menu Buttons
        -->
        <button class="red-button" (click)="rotateClick()" *ngIf="rotateVisible"><!--  && gameCode == 'backgammon' -->
            <i class="fas fa-sync"></i>
            {{ 'menu.rotate' | translate }}
        </button>
        
        <button class="red-button" (click)="flipClick()" *ngIf="flipVisible"><!--  && gameCode == 'backgammon' -->
            <i class="fas fa-arrow-up"></i>
            {{ 'menu.flip' | translate }}
        </button>
        
        <!--
        <button class="red-button smaller" *ngIf="! tutorial">
            Change theme
        </button>
        -->
        
        <button class="red-button" (click)="resignClick()" *ngIf="resignVisible">
            <i class="fas fa-flag"></i>
            {{ 'menu.resign' | translate }}
        </button>
        
        <button (click)="sendMove()" *ngIf="sendVisible" class="default-button">
            {{ 'game_board.done' | translate }}
        </button>
        
        <button (click)="undoMove()" *ngIf="undoVisible" class="secondary-button">
            {{ 'game_board.undo' | translate }}
        </button>
        
    </ng-container>
    
    <ng-container *ngIf="clearGameSessionsVisible">
        <button (click)="clearGameSessions()" class="red-button ms-4">
            Clear Game Sessions
        </button>
    </ng-container>
    
    <ng-container *ngIf="debugContractBridgeAuctionVisible">
        <button (click)="debugContractBridgeAuction()" class="red-button ms-4">
            Debug Contract Bridge Auction
        </button>
    </ng-container>
    
    <ng-container *ngIf="debugGameSoundsVisible">
        <button (click)="debugGameSounds()" class="red-button ms-4">
            Debug Game Sounds
        </button>
    </ng-container>
</div>

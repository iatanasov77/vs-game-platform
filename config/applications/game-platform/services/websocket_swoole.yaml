services:
    _defaults:
        autowire: true
        autoconfigure: true
    
    app_websocket_swoole_game_command:
        class: App\Component\WebsocketSwoole\Command\WebsocketServerCommand
        arguments:
            - '@app_websocket_logger'
            - "%kernel.project_dir%/public/game-platform"
            - '@app_websocket_swoole_game_handler'
        tags:
            - 'console.command'
    
    app_websocket_swoole_game_event_subscriber:
        class: App\Component\WebsocketSwoole\Websocket\Subscriber
        arguments:
            #- '@app_game_logger'
            - '@app_websocket_logger'
            - '@serializer'
            - '@vs_users.repository.users'
            - '@app_websocket_client_factory'
            - '@app_game_service'
            - "%env(bool:WEBSOCKET_EXCEPTION_TRACE)%"
    
    app_websocket_swoole_game_handler:
        class: App\Component\WebsocketSwoole\Websocket\ServerHandler
        arguments:
            #- '@app_game_logger'
            - '@app_websocket_logger'
            - '@serializer'
            - '@vs_users.repository.users'
            - '@app_websocket_client_factory'
            - '@app_game_service'
            - "%env(bool:WEBSOCKET_EXCEPTION_TRACE)%"

<table class="bridge-table mt-4">
    <thead>
        <tr>
            <th scope="col"></th>
            <th scope="col">Owner</th>
            <th scope="col">Guid</th>
            <th scope="col">Game</th>
            <th scope="col">Players Addition</th>
            <th scope="col">Players</th>
            <th scope="col">Status</th>
        </tr>
    </thead>
    <tbody>
        @for( bidHistoryNth of bidHistoryTransformed; track $index ) {
            <tr>
                @for( room of gameRooms; track $index; let idx = $index ) {
                    <th scope="row">{{ idx }}</th>
                    <td>{{ room.owner.name }}</td>
                    <td>
                        <span
                            ngbTooltip="{{ room.guid }}" placement="top"
                        >
                            {{ room.guid | slice: 0:15}} {{ room.guid.length > 15 ? '...' : ''}}
                        </span>
                    </td>
                    <td><!-- {{ room.game.title }} --></td>
                    <td><!-- {{ room.gamePlayers | length }} / {{ room.game.maxPlayers }} --></td>
                    <td>
                        <!--
                        <div class="cell-players observers">
                            {% for team in gameRoomTeams[room.id] %}
                                {% for player in team %}
                                    <div rel="0" class="player-slot dib">
                                        {{ player.photoUrlImage | raw }}
                                    </div>
                                {% endfor %}
                                
                                {% if not loop.last %}
                                    <div class="dib vs">VS</div>
                                {% endif %}
                            {% endfor %}
                        </div>
                        -->
                    </td>
                    <td>{{ room.status }}</td>
                }
            </tr>
        }
    </tbody>
</table>

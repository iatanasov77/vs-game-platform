services:
    _defaults:
        autowire: true
        autoconfigure: true
    
    App\Controller\GamePlatform\DebugController:
        tags: ['controller.service_arguments']
        autowire: true
    
    App\Controller\Application\TestMercureController:
        tags: ['controller.service_arguments']
        autowire: true
        arguments:
            - '@router'
            - '@doctrine'
            - '@messenger.default_bus'
            - '@app_mercure_logger'
            - '@app_mercure_publisher'
            - '@vsapp.repository.games'
            - '@vsapp.repository.game_players'
            - '@vsapp.factory.game_sessions'
            - '@vsapp.factory.temp_players'
    
    App\Component\ServerSentEvent\Handler\AddAiPlayerHandler:
        arguments:
            - '@app_mercure_logger'
            - '@mercure.hub.default'

monolog:
    channels:
        - event
        - doctrine
        - console
        - websocket_game
        - websocket_chat
        - mercure_game
        
        - test_websocket
    
    handlers:
        file_log:
            type: stream
            path: "%kernel.logs_dir%/%kernel.environment%.log"
            level: error
            channels: ["!websocket_game", "!websocket_chat", "!mercure_game"]
        websocket_game:
            type: stream
            path: '%kernel.logs_dir%/websocket_game.log' 
            level: info
            channels: ["websocket_game"]
        websocket_chat:
            type: stream
            path: '%kernel.logs_dir%/websocket_chat.log' 
            level: info
            channels: ["websocket_chat"]
        mercure_game:
            type: stream
            path: '%kernel.logs_dir%/mercure_game.log' 
            level: info
            channels: ["mercure_game"]
        
        test_websocket:
            type: stream
            path: '%kernel.logs_dir%/test_websocket.log'
            level: info
            channels: ["test_websocket"]
